name: release

# Build + push the vibe-backup image to GHCR. Mirrors the Vibe suite's
# publish convention (see Vibe-Tax-Research-Chat's release.yml).
#
# Triggers:
#   - push to main             → :main, :sha-<shortsha>
#   - tag push vX.Y.Z          → :X.Y.Z, :X.Y, :X, :latest
#   - workflow_dispatch        → :<branch>, :sha-<shortsha>
#
# `latest` comes ONLY from semver tag builds (metadata-action's
# auto-latest flavor) — minting it on main pushes too races two
# concurrent runs for the tag when a commit and its release tag are
# pushed together.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-image:
    name: publish image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Lower-case the repo owner — GHCR's image namespace is
      # case-sensitive and `KisaesDevLab/...` resolves differently
      # from `kisaesdevlab/...`.
      - name: Compute lowercased image path
        id: img
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/$OWNER_LC/vibe-backup" >> "$GITHUB_OUTPUT"

      # QEMU covers any future non-cross-compiled stage; the Go build
      # itself cross-compiles natively on the build platform.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=Vibe Backup
            org.opencontainers.image.description=Backup and verified-restore sidecar for the Vibe product family.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Internal-Use-1.0.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          # amd64 for the GMKtec NucBox M6 reference appliance; arm64 for
          # Apple Silicon dev boxes and arm mini-PC appliances.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
